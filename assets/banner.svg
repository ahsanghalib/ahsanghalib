    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#14b8c8" fill-opacity="0.12"/></pattern>
    <radialGradient id="glow" cx="0.9" cy="0.1" r="0.7"><stop offset="0" stop-color="#14b8c8" stop-opacity="0.22"/><stop offset="1" stop-color="#14b8c8" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="Background" inkscape:groupmode="layer" inkscape:label="Background">
